agents:
  kiro:
    command: "kiro-cli chat --trust-all-tools --no-interactive 'Execute {prompt}'"
    description: "Kiro CLI agent"
    windows-suffix: ".cmd"

  claude:
    command: "claude --dangerously-skip-permissions --verbose --print {prompt}"
    description: "Claude Code CLI"

  codex:
    command: "codex --dangerously-bypass-approvals-and-sandbox exec {prompt}"
    description: "OpenAI Codex CLI"
    windows-suffix: ".cmd"

  copilot:
    command: "copilot --allow-all --prompt {prompt}"
    description: "GitHub Copilot CLI"
    windows-suffix: ".cmd"

  opencode:
    command: "opencode run --auto {prompt}"
    description: "OpenCode CLI"
    windows-suffix: ".cmd"

  antigravity:
    command: "agy --dangerously-skip-permissions --prompt {prompt}"
    description: "Antigravity CLI"

  mistral-vibe:
    command: "vibe --yolo --prompt {prompt}"
    description: "Mistral Vibe CLI"

  crush:
    command: "crush run {prompt}"
    description: "Charm Crush"

  pi:
    command: "pi --print {prompt}"
    description: "PI Coding Agent"

  kimi:
    command: "kimi --prompt {prompt}"
    description: "Kimi Code"
  