agents:
  kiro:
    command: "kiro-cli chat -a --no-interactive {prompt}"
    prompt_mode: "file"
    description: "Kiro CLI agent"

  claude-code:
    command: "claude --print {prompt}"
    prompt_mode: "stdin"
    description: "Claude Code CLI"

  codex:
    command: "codex --prompt {prompt}"
    prompt_mode: "arg"
    description: "OpenAI Codex CLI"

  copilot:
    command: "copilot {prompt}"
    prompt_mode: "arg"
    description: "GitHub Copilot CLI"

  opencode:
    command: "opencode --prompt {prompt}"
    prompt_mode: "file"
    description: "OpenCode CLI"

  antigravity:
    command: "antigravity --prompt {prompt}"
    prompt_mode: "file"
    description: "Antigravity CLI"

  mistral-vibe:
    command: "vibe --prompt {prompt}"
    prompt_mode: "file"
    description: "Mistral Vibe CLI"
